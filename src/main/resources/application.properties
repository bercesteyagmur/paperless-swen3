spring.application.name=PaperlessRest

server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paperless}
spring.datasource.username=${DB_USER:paperless}
spring.datasource.password=${DB_PASSWORD:paperless}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:paperless}

#source:https://docs.spring.io/spring-boot/reference/messaging/amqp.html
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2s

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
