services:
  db:
    image: postgres:16
    container_name: paperless-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
    ports:
      - "5432:5432"
    volumes:
      - paperless-db-data:/var/lib/postgresql/data
    healthcheck:
      #source: https://www.postgresql.org/docs/16/app-pg-isready.html
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: paperless-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-paperless}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      #source: https://www.rabbitmq.com/docs/monitoring
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z #original MinIO image is no longer available, so we use a pinned mirror
    container_name: paperless-minio
    command: server /storage --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - paperless-minio-data:/storage
    healthcheck:
      #source: https://docs.min.io/aistor/operations/monitoring/healthcheck-probe/
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: paperless-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - paperless-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      #source: https://www.baeldung.com/ops/elasticsearch-docker-compose
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.1
    container_name: paperless-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.1
    container_name: paperless-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      elasticsearch:
        condition: service_healthy

  paperless-rest:
    build:
      dockerfile: Dockerfile
    container_name: paperless-rest
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-paperless}
      DB_USER: ${POSTGRES_USER:-paperless}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOGSTASH_HOST: logstash
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started

  ocr-worker:
    build:
      context: ./ocr-worker
      dockerfile: Dockerfile
    container_name: paperless-ocr-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      LOGSTASH_HOST: logstash
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      logstash:
        condition: service_started

  genai-worker:
    build:
      context: ./genai-worker
      dockerfile: Dockerfile
    container_name: paperless-genai-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOGSTASH_HOST: logstash
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started

  nginx:
    build:
      dockerfile: frontend/Dockerfile
    container_name: paperless-nginx
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

volumes:
  paperless-db-data:
  paperless-minio-data:
  paperless-elasticsearch-data:
