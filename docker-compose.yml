services:
  db:
    image: postgres:16
    container_name: paperless-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
    ports:
      - "5432:5432"
    volumes:
      - paperless-db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: paperless-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-paperless}
    ports:
      - "5672:5672"
      - "15672:15672"

  paperless-rest:
    build:
      dockerfile: Dockerfile
    container_name: paperless-rest
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-paperless}
      DB_USER: ${POSTGRES_USER:-paperless}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
    depends_on:
      - db
      - rabbitmq

  nginx:
    build:
      dockerfile: frontend/Dockerfile
    container_name: paperless-nginx
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

volumes:
  paperless-db-data:
