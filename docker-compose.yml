services:
  db:
    image: postgres:16
    container_name: paperless-db
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "5432:5432"
    volumes:
      - paperless-db-data:/var/lib/postgresql/data

  paperless-rest:
    build: .
    container_name: paperless-rest
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paperless
      DB_USER: paperless
      DB_PASSWORD: paperless
    depends_on:
      - db

volumes:
  paperless-db-data:
