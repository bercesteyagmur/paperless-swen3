services:
  db:
    image: postgres:16
    container_name: paperless-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
    ports:
      - "5432:5432"
    volumes:
      - paperless-db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: paperless-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-paperless}
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z #original MinIO image is no longer available, so we use a pinned mirror
    container_name: paperless-minio
    command: server /storage --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - paperless-minio-data:/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: paperless-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - paperless-elasticsearch-data:/usr/share/elasticsearch/data

  #web interface for elasticsearch
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.1
    container_name: paperless-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  paperless-rest:
    build:
      dockerfile: Dockerfile
    container_name: paperless-rest
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-paperless}
      DB_USER: ${POSTGRES_USER:-paperless}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    depends_on:
      - db
      - rabbitmq
      - minio

  ocr-worker:
    build:
      context: ./ocr-worker
      dockerfile: Dockerfile
    container_name: paperless-ocr-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    depends_on:
      - rabbitmq
      - minio

  indexing-worker:
    build:
      context: ./indexing-worker
      dockerfile: Dockerfile
    container_name: paperless-indexing-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - rabbitmq
      - elasticsearch

  nginx:
    build:
      dockerfile: frontend/Dockerfile
    container_name: paperless-nginx
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

volumes:
  paperless-db-data:
  paperless-minio-data:
  paperless-elasticsearch-data:
