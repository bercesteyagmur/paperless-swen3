spring.application.name=GenAIWorker

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:paperless}

spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
#gemini-3.8-flash returned 503 because of high demand, so we use the smaller model
#primary:gemini-3.5-flash-lite, fallback:gemini-3.1-flash-lite
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.max-output-tokens=300
