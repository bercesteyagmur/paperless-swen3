spring.application.name=OcrWorker

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:paperless}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

minio.url=${MINIO_URL:http://localhost:9000}
minio.user=${MINIO_USER:minioadmin}
minio.password=${MINIO_PASSWORD:minioadmin}
